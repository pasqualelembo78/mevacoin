# Mevacoin Participation System Configuration

enable-participation=1
pool-percentage=0.03

node-registry-db=/var/lib/mevacoin/node_registry
participation-db=/var/lib/mevacoin/participation
uptime-db=/var/lib/mevacoin/participation/uptime
badge-db=/var/lib/mevacoin/badges
reward-db=/var/lib/mevacoin/rewards

participation-port=18088
participation-bind-ip=0.0.0.0

poa-challenge-interval=36000
poa-timeout-ms=2000
poa-challenges-per-period=3

distribution-period=240
distribution-maturation=10

participation-log-level=INFO

# ─────────────────────────────────────────────────────────────────
# NODE SIGNING KEY (generata automaticamente, NON condividere)
# ─────────────────────────────────────────────────────────────────
# Percorso: {data-dir}/participation/node_signing_key
# Creata al primo avvio, persistente tra i riavvii.
# Identifica univocamente il tuo nodo sulla rete MevaCoin.
#
# Per vedere la tua node_pk (pubkey):
#   grep "node_pk=" ~/.bitmonero/mevacoin/mevacoin.log | tail -1
#
# Per registrare il nodo (da wallet-cli):
#   register_node <node_pubkey_hex> <txid> <output_index>
# ─────────────────────────────────────────────────────────────────
